name: SNB probe (temporaire)
on:
  push:
    branches: [snb-probe]
    paths: [.github/workflows/snb-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pandas==3.0.5
      - name: Test reel de telecharger_snb.py (fichier tronque de 3 mois)
        run: |
          tail -2 data/SARON.csv
          python telecharger_snb.py
          tail -3 data/SARON.csv
          python telecharger_snb.py
      - name: Enregistrer
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/SARON.csv && git commit -m "probe result" && git push
